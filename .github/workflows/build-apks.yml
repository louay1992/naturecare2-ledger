name: Build both NatureCare Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build owner and supplier debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleOwnerDebug :app:assembleSupplierDebug
      - name: Deliver APK for Louay
        uses: actions/upload-artifact@v4
        with:
          name: NatureCare-Louay-APK
          path: app/build/outputs/apk/owner/debug/app-owner-debug.apk
          if-no-files-found: error
      - name: Deliver APK for Ibrahim
        uses: actions/upload-artifact@v4
        with:
          name: NatureCare-Ibrahim-APK
          path: app/build/outputs/apk/supplier/debug/app-supplier-debug.apk
          if-no-files-found: error
