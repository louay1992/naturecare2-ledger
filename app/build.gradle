plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android {
    namespace 'com.naturecare.ledger'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    flavorDimensions 'role'
    productFlavors {
        owner {
            dimension 'role'
            applicationId 'com.naturecare.ledger.owner'
            resValue 'string', 'app_name', 'NatureCare | Louay'
            buildConfigField 'String', 'START_URL', '"https://acc-naturecare.netlify.app/owner.html"'
        }
        supplier {
            dimension 'role'
            applicationId 'com.naturecare.ledger.supplier'
            resValue 'string', 'app_name', 'NatureCare | Supplier'
            buildConfigField 'String', 'START_URL', '"https://acc-naturecare.netlify.app/supplier.html"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
